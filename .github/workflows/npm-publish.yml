name: npm-publish

# Trusted publishing (OIDC) — no npm token needed:
# npmjs.com package settings must declare this workflow file name
# (npm-publish.yml) as a trusted publisher for the matching repo.
on:
  release:
    types: [published]

permissions:
  id-token: write # Required for OIDC (npm trusted publishing)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: npm publish (OIDC)
        run: npm publish --access public
